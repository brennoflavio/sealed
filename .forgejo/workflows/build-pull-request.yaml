name: Build pull request
enable-email-notifications: true

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CLICKABLE_FRAMEWORK: ubuntu-touch-24.04-1.x

jobs:
  build:
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: clickable-ut24-1x
    timeout-minutes: 45

    steps:
      - name: Install Node.js for JavaScript actions
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64) NODE_ARCH=x64 ;;
            aarch64) NODE_ARCH=arm64 ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          NODE_VERSION=v20.19.2
          NODE_FILENAME="node-$NODE_VERSION-linux-$NODE_ARCH.tar.gz"
          NODE_DIR="$HOME/.local/node-$NODE_VERSION"
          curl -fsSL "https://nodejs.org/dist/$NODE_VERSION/$NODE_FILENAME" -o "/tmp/$NODE_FILENAME"
          curl -fsSL "https://nodejs.org/dist/$NODE_VERSION/SHASUMS256.txt" -o /tmp/SHASUMS256.txt
          cd /tmp
          grep " $NODE_FILENAME$" SHASUMS256.txt | sha256sum -c -
          mkdir -p "$NODE_DIR"
          tar -xzf "/tmp/$NODE_FILENAME" -C "$NODE_DIR" --strip-components=1
          echo "$NODE_DIR/bin" >> "$GITHUB_PATH"

      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner tooling
        run: |
          set -eu
          node --version
          clickable --version
          docker info >/dev/null

      - name: Build
        run: clickable build --arch arm64

      - name: Upload Click package
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: sealed-click-arm64
          path: build/*/app/*.click
          if-no-files-found: error

concurrency:
  group: build-pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true
